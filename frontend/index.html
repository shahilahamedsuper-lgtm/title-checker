<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Primary meta ──────────────────────────────────────────────────── -->
    <title>Semantic Validator — AI-Powered Document Analysis</title>
    <meta name="description" content="Upload documents and Excel files, analyze content for meaning, tone and clarity, deduplicate data, check text similarity, and chat with AI — all in one place." />
    <meta name="keywords" content="semantic validator, AI document analysis, text analysis, Excel analysis, deduplication, similarity checker, AI assistant, Claude AI" />
    <meta name="author" content="Semantic Validator" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme ─────────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#020408" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-TileColor" content="#020408" />

    <!-- ── Canonical ─────────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://semantic-validator.app/" />

    <!-- ── Open Graph ────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Semantic Validator" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Semantic Validator — AI-Powered Document Analysis" />
    <meta property="og:description" content="Upload documents and Excel files, analyze content for meaning, tone and clarity, deduplicate data, check text similarity, and chat with AI." />
    <meta property="og:url" content="https://semantic-validator.app/" />
    <meta property="og:image" content="https://semantic-validator.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Semantic Validator — AI-Powered Document Analysis" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Semantic Validator — AI-Powered Document Analysis" />
    <meta name="twitter:description" content="Upload documents and Excel files, analyze content for meaning, tone and clarity, deduplicate data, check text similarity, and chat with AI." />
    <meta name="twitter:image" content="https://semantic-validator.app/og-image.png" />

    <!-- ── Favicons ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Resource hints ────────────────────────────────────────────────── -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Backend API -->
    <link rel="dns-prefetch" href="http://127.0.0.1:8000" />
    <!-- Anthropic API (used by backend, but prefetch helps TLS handshake) -->
    <link rel="dns-prefetch" href="https://api.anthropic.com" />

    <!-- ── Dark-mode flash prevention ────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
