# ── VPS Nginx config (bare-metal, no Docker) ─────────────────────────────────
# Place this file at: /etc/nginx/sites-available/myapp
# Then: sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name myapp.com www.myapp.com;

    # Redirect HTTP → HTTPS (uncomment after running Certbot)
    # return 301 https://$host$request_uri;

    # ── Frontend (React build) ────────────────────────────────────────────────
    root /var/www/myapp/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend proxy ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── React Router fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

