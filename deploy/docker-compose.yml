services:
  # ── Express backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # No ALLOWED_ORIGINS needed — Nginx handles same-origin in production
    expose:
      - "5000"          # internal only; Nginx proxies to it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── React frontend + Nginx ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""   # empty = same-origin (Nginx proxies /api)
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "80:80"         # expose to the world
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: app_network
